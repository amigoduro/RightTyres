<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal | Right Tyres</title>   
    <style>
        /* Core Reset & Typography */   
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* The Main Split-Screen Container */
        .login-container {
            display: flex;
            width: 1100px;
            max-width: 95%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        /* Left Side: Corporate Branding */
        .branding-panel {
            flex: 1;
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            padding: 60px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }
        .branding-panel h1 { font-size: 48px; font-weight: 900; margin: 0 0 15px 0; letter-spacing: 2px; text-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .branding-panel p { font-size: 20px; line-height: 1.6; color: #e8f0fe; margin: 0; font-weight: 500; }
        .branding-panel .secure-badge { margin-top: 50px; display: inline-block;
                                       padding: 12px 20px;
                                       background: rgba(255,255,255,0.15); 
                                       border: 2px solid rgba(255,255,255,0.3);
                                       border-radius: 30px; font-size: 16px;
                                       font-weight: 800; letter-spacing: 1px;
                                       text-transform: uppercase;}

        /* Right Side: The Interactive Forms */
        .form-panel {
            flex: 1.2;
            padding: 50px 60px;
            background: #ffffff;
        }

        /* Tab Navigation - Bold & Visible */
        .tab-nav { display: flex; border-bottom: 3px solid #e2e8f0; margin-bottom: 40px; }
        .tab-btn {
            flex: 1; text-align: center; padding: 18px 0; 
            font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            color: #94a3b8; cursor: pointer; transition: all 0.3s;
            border-bottom: 5px solid transparent; margin-bottom: -3px;
        }
        .tab-btn:hover { color: #0d6efd; }
        .tab-btn.active { color: #0d6efd; border-bottom-color: #0d6efd; }

        /* Form Elements */
        .form-section { display: none; animation: fadeIn 0.4s ease; }
        .form-section.active { display: block; }
        
        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group input { 
            width: 100%; padding: 18px; font-size: 18px; font-weight: 600; color: #0f172a;
            border: 2px solid #cbd5e1; border-radius: 8px; transition: all 0.2s; background: #f8fafc; 
        }
        .form-group input::placeholder { color: #94a3b8; font-weight: 500; }
        .form-group input:focus { outline: none; border: 3px solid #0d6efd; background: white; box-shadow: 0 0 15px rgba(13, 110, 253, 0.15); padding: 17px; }

        /* Buttons - Massive & Bold */
        .btn-submit {
            width: 100%; background: #0d6efd; color: white; border: none; padding: 20px;
            font-size: 20px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
            border-radius: 8px; cursor: pointer; transition: all 0.2s; margin-top: 15px;
            box-shadow: 0 6px 20px rgba(13, 110, 253, 0.3);
        }
        .btn-submit:hover { background: #0b5ed7; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(13, 110, 253, 0.4); }
        .btn-submit:active { transform: translateY(1px); box-shadow: 0 2px 10px rgba(13, 110, 253, 0.3); }

        .btn-admin { background: #1e293b; box-shadow: 0 6px 20px rgba(30, 41, 59, 0.3); }
        .btn-admin:hover { background: #0f172a; box-shadow: 0 8px 25px rgba(30, 41, 59, 0.4); }

        /* Hidden OTP Section */
        #otpSection { display: none; margin-top: 30px; border-top: 3px dashed #e2e8f0; padding-top: 35px; }
        .otp-inputs { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
        .otp-inputs input { 
            width: 75px; height: 75px; text-align: center; font-size: 36px; font-weight: 900; color: #1e293b;
            border-radius: 12px; border: 3px solid #cbd5e1; background: #f8fafc;
        }
        .otp-inputs input:focus { border-color: #27ae60; background: white; box-shadow: 0 0 15px rgba(39, 174, 96, 0.2); outline: none; }
        
        .btn-verify { background: #27ae60; box-shadow: 0 6px 20px rgba(39, 174, 96, 0.3); }
        .btn-verify:hover { background: #16a34a; box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .login-container { flex-direction: column; }
            .branding-panel { padding: 40px 30px; text-align: center; }
            .form-panel { padding: 40px 30px; }
            .tab-btn { font-size: 16px; padding: 15px 0; }
            .otp-inputs input { width: 60px; height: 60px; font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="branding-panel">
            <h1>RIGHT TYRES</h1>
            <p>Enterprise Fleet Profiler & Procurement Intelligence Platform.</p>
            <div class="secure-badge">🔒 AES-256 Encrypted Portal</div>   
        </div>

        <div class="form-panel">
            
            <div class="tab-nav">
                <div class="tab-btn active" onclick="switchTab('user')">Fleet Manager</div>
                <div class="tab-btn" onclick="switchTab('admin')">System Admin</div>
            </div>

            <div id="userTab" class="form-section active">
                <form id="userLoginForm">
                    <div id="userInfoSection">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="userName" placeholder="e.g. Rahul Sharma" required>
                        </div>
                        <div class="form-group">
                            <label>Mobile Number</label>
                            <input type="tel" id="userPhone" placeholder="e.g. +91 9876543210" required>
                        </div>
                        <div class="form-group">
                            <label>Corporate Email Address</label>
                            <input type="email" id="userEmail" placeholder="manager@fleet.com" required>
                        </div>
                        <button type="button" class="btn-submit" id="requestOtpBtn" onclick="triggerOTP()">Send Secure OTP ➔</button>
                    </div>

                    <div id="otpSection">
                        <label style="display:block; text-align:center; font-size: 18px; font-weight:800; color:#1e293b; margin-bottom: 20px;">
                            ENTER THE 4-DIGIT CODE SENT TO YOUR EMAIL
                        </label>
                        <div class="otp-inputs">
                            <input type="text" maxlength="1" oninput="moveToNext(this, 'otp2')" id="otp1">
                            <input type="text" maxlength="1" oninput="moveToNext(this, 'otp3')" id="otp2">
                            <input type="text" maxlength="1" oninput="moveToNext(this, 'otp4')" id="otp3">
                            <input type="text" maxlength="1" id="otp4">
                        </div>
                        <button type="button" class="btn-submit btn-verify" onclick="verifyUserLogin()">Verify & Enter Platform</button>
                    </div>
                </form>
            </div>

            <div id="adminTab" class="form-section">
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label>Administrator ID</label>
                        <input type="text" id="adminId" placeholder="Admin Username or Email" required>
                    </div>
                    <div class="form-group">
                        <label>Master Password</label>
                        <input type="password" id="adminPassword" placeholder="••••••••" required>
                    </div>
                    <button type="button" class="btn-submit btn-admin" onclick="verifyAdminLogin()">Authorize Access</button>
                </form>
            </div>

        </div>
    </div>

    <script>
        let pendingUserEmail = ""; 

        function switchTab(tabType) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(sec => sec.classList.remove('active'));
            if (tabType === 'user') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('userTab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('adminTab').classList.add('active');
            }
        }

        function moveToNext(currentInput, nextInputId) {
            if (currentInput.value.length === 1) {
                document.getElementById(nextInputId).focus();
            }
        }

        function triggerOTP() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const email = document.getElementById('userEmail').value;
            const btn = document.getElementById('requestOtpBtn');

            if(!name || !phone || !email) {
                alert("Please fill in all your information first.");
                return;
            }

            pendingUserEmail = email; 
            btn.innerText = "Transmitting...";
            btn.style.opacity = "0.7";

            fetch('http://localhost:3000/api/request-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, phone, email })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    document.getElementById('userInfoSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                    document.getElementById('otp1').focus();
                } else {
                    alert("System Error: Could not send email. Check XAMPP and server.js.");
                    btn.innerText = "Send Secure OTP ➔";
                    btn.style.opacity = "1";
                }
            })
            .catch(error => {
                console.error("Network Error:", error);
                alert("Network Error: Is server.js running in your VS Code terminal?");
                btn.innerText = "Send Secure OTP ➔";
                btn.style.opacity = "1";
            });
        }

        function verifyUserLogin() {
            const enteredOTP = document.getElementById('otp1').value + document.getElementById('otp2').value + document.getElementById('otp3').value + document.getElementById('otp4').value;
            
            if(enteredOTP.length !== 4) {
                alert("Please enter a valid 4-digit code.");
                return;
            }

            fetch('http://localhost:3000/api/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: pendingUserEmail, otp: enteredOTP })
            })
            .then(response => response.json())
            .then(data => {
                if(data.success) {
                    sessionStorage.setItem('RightTyresUserAuth', 'true');
                    
                    // 👉 THE NEW LINE: Locks the user's email into the session memory
                    sessionStorage.setItem('RightTyresUserEmail', pendingUserEmail);
                    
                    // Rerouted straight to the Homepage 
                    window.location.href = 'index.html'; 
                } else {
                    alert("ACCESS DENIED: Incorrect Authorization Code.");
                }
            });
        }

        function verifyAdminLogin() {
            const adminId = document.getElementById('adminId').value;
            const adminPass = document.getElementById('adminPassword').value;

            if(adminId === 'admin' && adminPass === 'admin123') {
                sessionStorage.setItem('RightTyresAdminAuth', 'true');
                window.location.href = 'admin.html';
            } else {
                alert("ACCESS DENIED: Invalid Administrator Credentials.");
            }
        }
    </script>
</body>
</html>
